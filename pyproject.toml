[tool.poetry]
name = "nora-livekit"
version = "0.1.0"
description = "LiveKit-based voice agent for Nora (migrated from Ultravox/Jambonz)"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "nora_livekit", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
livekit-agents = {version = "~1.0", extras = ["openai", "deepgram", "cartesia", "turn-detector"]}
fastapi = "~0.115"
uvicorn = {version = "~0.32", extras = ["standard"]}
python-dotenv = "~1.0"
structlog = "~24.4"
httpx = "~0.27"

[tool.poetry.group.dev.dependencies]
pytest = "~8.3"
pytest-asyncio = "~0.24"
pytest-cov = "~6.0"
ruff = "~0.7"
black = "~24.10"
mypy = "~1.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (requires LiveKit)",
]
addopts = "--strict-markers"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C", "T", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
