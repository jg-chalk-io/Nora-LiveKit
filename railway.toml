# Railway deployment configuration for Nora Voice Agent
# https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Start command
startCommand = "python scripts/run_voice_agent.py start"

# IMPORTANT: LiveKit agents are workers, not web servers
# They connect outbound to LiveKit Cloud via WebSocket
# No HTTP health check needed - Railway monitors process health
healthcheckPath = ""

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Resource allocation
numReplicas = 1
